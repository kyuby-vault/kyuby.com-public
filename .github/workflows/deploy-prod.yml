name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'main or a full commit SHA already on main'
        type: string
        required: true
      confirm:
        description: 'Type: deploy-kyuby-com'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  gates:
    if: github.repository == 'kyuby-vault/kyuby.com-public' && github.event.inputs.confirm == 'deploy-kyuby-com' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$DEPLOY_CONFIRM" = deploy-kyuby-com
          if [[ "$DEPLOY_REF" == main ]]; then
            DEPLOY_REF=refs/remotes/origin/main
          elif [[ ! "$DEPLOY_REF" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "Only main or a full SHA on main is allowed." >&2
            exit 1
          fi
          SHA=$(git rev-parse --verify --end-of-options "${DEPLOY_REF}^{commit}")
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main
          git checkout --detach "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_REF: ${{ inputs.ref }}
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
      - name: Prepare export-compatible container inputs
        run: bash .github/workflows/devpod/ci-image.sh --prepare
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kyuby-devpod-build-cache
          key: ${{ runner.os }}-devpod-${{ hashFiles('Containerfile', 'package-lock.json', '.github/workflows/devpod/**') }}
          restore-keys: ${{ runner.os }}-devpod-
      - name: Build the Node 22 DevPod with layer caching and smoke assertions
        run: bash .github/workflows/devpod/ci-image.sh
      - name: Container gates (private full suite; public curated build gates)
        run: node .github/workflows/devpod/invoke.mjs gates
        env:
          CONTAINER_ENGINE: docker

  prod-deploy:
    needs: gates
    if: github.repository == 'kyuby-vault/kyuby.com-public' && github.event.inputs.confirm == 'deploy-kyuby-com' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.gates.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify production protections and ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/prod" --jq 'any(.protection_rules[]; .type == "required_reviewers" and any(.reviewers[]; .reviewer.id == 40538530)) and .deployment_branch_policy.custom_branch_policies' | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/environments/prod/deployment-branch-policies" --jq '.branch_policies | length == 1 and .[0].name == "main" and .[0].type == "branch"' | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/branches/main/protection" --jq '(.enforce_admins.enabled == false) and (.required_pull_request_reviews == null) and any(.restrictions.users[]; .id == 40538530) and .required_status_checks.strict and (.required_status_checks.contexts | index("gates") != null) and (.allow_force_pushes.enabled == false) and (.allow_deletions.enabled == false)' | grep -qx true
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Prepare export-compatible container inputs
        run: bash .github/workflows/devpod/ci-image.sh --prepare
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kyuby-devpod-build-cache
          key: ${{ runner.os }}-devpod-${{ hashFiles('Containerfile', 'package-lock.json', '.github/workflows/devpod/**') }}
          restore-keys: ${{ runner.os }}-devpod-
      - name: Build the Node 22 DevPod with layer caching and smoke assertions
        run: bash .github/workflows/devpod/ci-image.sh
      - name: Container gates (private full suite; public curated build gates)
        run: node .github/workflows/devpod/invoke.mjs gates
        env:
          CONTAINER_ENGINE: docker
      - name: Deploy Pages production
        id: deploy
        shell: bash
        env:
          CONTAINER_ENGINE: docker
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ needs.gates.outputs.sha }}
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
          PAGES_LOG: ${{ runner.temp }}/pages-prod.log
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          node .github/workflows/devpod/invoke.mjs upload-prod 2>&1 | tee "$PAGES_LOG"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { stripVTControlCharacters } from 'node:util';
          const log = stripVTControlCharacters(readFileSync(process.env.PAGES_LOG, 'utf8'));
          const url = log.match(/https:\/\/[a-z0-9-]+\.kyuby-com\.pages\.dev(?=[\s/]|$)/)?.[0];
          if (!url) throw new Error('Wrangler did not report a Pages URL.');
          appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Pages production: ${url}\n`);
          NODE
